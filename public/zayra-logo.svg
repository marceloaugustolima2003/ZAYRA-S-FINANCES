<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background border gradient -->
    <linearGradient id="rainbowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="25%" stopColor="#818cf8" />
      <stop offset="50%" stopColor="#c084fc" />
      <stop offset="75%" stopColor="#f472b6" />
      <stop offset="100%" stopColor="#4ade80" />
    </linearGradient>

    <!-- Ear gradients -->
    <linearGradient id="pinkSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#f472b6" />
      <stop offset="100%" stopColor="#e11d48" />
    </linearGradient>

    <linearGradient id="innerEar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#fce7f3" />
      <stop offset="100%" stopColor="#fbcfe8" />
    </linearGradient>

    <radialGradient id="leftGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stopColor="#ec4899" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stopColor="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <filter id="pawShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Dark squircle background -->
  <rect width="512" height="512" rx="112" fill="#090d16" />

  <!-- Iridescent outline border -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#rainbowBorder)" stroke-width="6" />

  <!-- Atmospheric bokeh lights in background -->
  <circle cx="150" cy="180" r="100" fill="url(#leftGlow)" />
  <circle cx="360" cy="180" r="100" fill="url(#rightGlow)" />

  <!-- Top subtle glossy rim highlight -->
  <path d="M 64 116 C 160 68 352 68 448 116" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- ZAYRA CHARACTER GROUP -->
  <g id="zayra-character">
    <!-- EARS -->
    <!-- Left Ear -->
    <g transform="rotate(-14 185 130)">
      <ellipse cx="185" cy="120" rx="38" ry="60" fill="#f472b6" />
      <ellipse cx="185" cy="126" rx="22" ry="42" fill="url(#innerEar)" />
    </g>

    <!-- Right Ear -->
    <g transform="rotate(14 327 130)">
      <ellipse cx="327" cy="120" rx="38" ry="60" fill="#f472b6" />
      <ellipse cx="327" cy="126" rx="22" ry="42" fill="url(#innerEar)" />
    </g>

    <!-- LOWER BODY -->
    <path d="M 132 436 C 132 355 174 332 256 332 C 338 332 380 355 380 436 C 380 464 340 468 256 468 C 172 468 132 464 132 436 Z" fill="#f472b6" />

    <!-- PAWS -->
    <!-- Left Paw -->
    <g filter="url(#pawShadow)">
      <ellipse cx="196" cy="436" rx="27" ry="18" fill="#ffffff" />
      <path d="M 191 429 L 191 441 M 201 429 L 201 441" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Right Paw -->
    <g filter="url(#pawShadow)">
      <ellipse cx="316" cy="436" rx="27" ry="18" fill="#ffffff" />
      <path d="M 311 429 L 311 441 M 321 429 L 321 441" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- HOOD HEAD -->
    <!-- Pink Round Hood -->
    <circle cx="256" cy="242" r="128" fill="#f472b6" />

    <!-- Hood bottom shadow -->
    <path d="M 148 290 C 175 352 337 352 364 290 C 350 345 310 366 256 366 C 202 366 162 345 148 290 Z" fill="#be185d" opacity="0.3" />

    <!-- Dark Inner Hood Opening -->
    <circle cx="256" cy="248" r="94" fill="#0f172a" />

    <!-- White Collar Spikes / Teeth on the Hood Aperture -->
    <!-- Top Teeth Ring -->
    <polygon points="178,198 190,214 198,194" fill="#ffffff" />
    <polygon points="204,188 217,208 226,186" fill="#ffffff" />
    <polygon points="234,182 246,205 256,180" fill="#ffffff" />
    <polygon points="256,180 266,205 278,182" fill="#ffffff" />
    <polygon points="286,186 295,208 308,188" fill="#ffffff" />
    <polygon points="314,194 322,214 334,198" fill="#ffffff" />

    <!-- Cheek Spikes -->
    <polygon points="172,234 136,252 172,266" fill="#ffffff" />
    <polygon points="340,234 376,252 340,266" fill="#ffffff" />

    <!-- PUPPY WHITE FACE -->
    <ellipse cx="256" cy="254" rx="80" ry="70" fill="#ffffff" />
    <!-- Fluffy cheek tufts -->
    <circle cx="190" cy="254" r="14" fill="#ffffff" />
    <circle cx="194" cy="270" r="13" fill="#ffffff" />
    <circle cx="322" cy="254" r="14" fill="#ffffff" />
    <circle cx="318" cy="270" r="13" fill="#ffffff" />

    <!-- FACE DETAILS -->
    <!-- Left Eye -->
    <g>
      <ellipse cx="222" cy="234" rx="17" ry="19" fill="#090d16" />
      <!-- Specular shine reflections -->
      <circle cx="217" cy="227" r="7" fill="#ffffff" />
      <circle cx="227" cy="241" r="3.5" fill="#ffffff" />
    </g>

    <!-- Right Eye -->
    <g>
      <ellipse cx="290" cy="234" rx="17" ry="19" fill="#090d16" />
      <!-- Specular shine reflections -->
      <circle cx="285" cy="227" r="7" fill="#ffffff" />
      <circle cx="295" cy="241" r="3.5" fill="#ffffff" />
    </g>

    <!-- Cute Nose & Snout -->
    <ellipse cx="256" cy="271" rx="8.5" ry="6.5" fill="#090d16" />
    <ellipse cx="254.5" cy="269" rx="3.5" ry="1.8" fill="#ffffff" opacity="0.6" />
    <line x1="256" y1="277.5" x2="256" y2="284" stroke="#090d16" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 247 282 Q 256 290 265 282" fill="none" stroke="#090d16" stroke-width="2.2" stroke-linecap="round" />

    <!-- Whisker dots -->
    <circle cx="236" cy="276" r="1.6" fill="#94a3b8" />
    <circle cx="240" cy="280" r="1.6" fill="#94a3b8" />
    <circle cx="235" cy="284" r="1.6" fill="#94a3b8" />

    <circle cx="276" cy="276" r="1.6" fill="#94a3b8" />
    <circle cx="272" cy="280" r="1.6" fill="#94a3b8" />
    <circle cx="277" cy="284" r="1.6" fill="#94a3b8" />
  </g>
</svg>
